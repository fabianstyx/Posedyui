name: Build and Sign Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Clone submodules manually
      run: |
        cd chiaki-v2.2.0
        # Clone nanopb
        git clone --depth 1 https://github.com/nanopb/nanopb.git third-party/nanopb
        # Clone jerasure
        git clone --depth 1 https://git.sr.ht/~thestr4ng3r/jerasure third-party/jerasure
        # Clone gf-complete
        git clone --depth 1 https://git.sr.ht/~thestr4ng3r/gf-complete third-party/gf-complete
        # Clone oboe
        git clone --depth 1 https://github.com/google/oboe android/app/src/main/cpp/oboe
        # Clone munit (for tests)
        git clone --depth 1 https://github.com/nemequ/munit.git test/munit
    
    - name: Install protobuf compiler and Python dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        pip install protobuf grpcio-tools
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x chiaki-v2.2.0/android/gradlew
    
    - name: Build Release APK
      working-directory: chiaki-v2.2.0/android
      run: ./gradlew assembleRelease --no-daemon

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: chiaki-v2.2.0/android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_FILE }}
        alias: ${{ secrets.POSEDY_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.POSEDY_KEYSTORE_PW }}
        keyPassword: ${{ secrets.POSEDY_KEY_PW }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
    
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: chiaki-modded
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        retention-days: 30
